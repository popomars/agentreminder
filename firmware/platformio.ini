[platformio]
default_envs = esp32s3

; Waveshare ESP32-S3-Touch-AMOLED-2.16, 16 MB flash / 8 MB OPI PSRAM.
[env:esp32s3]
platform = espressif32 @ 6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
build_src_filter = +<*> -<fonts/agentreminder_passport_24.c>
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DBOARD_HAS_PSRAM
  -DLV_LVGL_H_INCLUDE_SIMPLE
  -DLV_CONF_INCLUDE_SIMPLE
  -Iinclude
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  lvgl/lvgl @ 9.2.2
  bblanchon/ArduinoJson @ 7.2.0

; FoloToy AI Passport community play. Package with build-passport.sh.
[env:folotoy-passport]
platform = ${env:esp32s3.platform}
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions-passport.csv
board_build.flash_mode = dio
board_upload.flash_size = 8MB
build_src_filter = +<*> -<fonts/agentreminder_cjk_35.c> -<fonts/agentreminder_meta_24.c> -<fonts/agentreminder_hint_22.c>
build_flags =
  -DAGENTREMINDER_PASSPORT
  -Wl,--wrap=nvs_flash_init
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DLV_LVGL_H_INCLUDE_SIMPLE
  -DLV_CONF_INCLUDE_SIMPLE
  -Iinclude
  -DCORE_DEBUG_LEVEL=0
lib_deps = ${env:esp32s3.lib_deps}
